name: Docker Build

on:
  push:
    branches: [ "main", "master" ] # 不管是main还是master分支改动都触发
  workflow_dispatch: # 允许手动点按钮触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: 登录 Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }} # 自动去组织保险箱拿
          password: ${{ secrets.DOCKER_PASSWORD }} # 自动去组织保险箱拿
          
      - name: 设置构建环境
        uses: docker/setup-buildx-action@v2
        
      - name: 构建并推送到 Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: xueyue052/antigravity2api-node-js:latest

